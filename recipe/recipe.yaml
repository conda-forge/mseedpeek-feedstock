context:
  name: mseedpeek
  version: "1.1.0"
  python_min: "3.12"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://gitlab.com/earthscope/public/epic/passoft/mseedpeek/-/archive/v${{ version }}/mseedpeek-v${{ version }}.tar.gz
  sha256: 03e075845ab34fdcc2a15a516cf97334a3cce85bdf3635a843d35b15a90b64c5

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - mseedpeek = mseedpeek.mseedpeek:main
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - pyside6
    - if: linux
      then:
        - __linux
    - if: osx
      then:
        - __osx

tests:
  - python:
      imports:
        - mseedpeek
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - mseedpeek -#
  - script:
      - python -m unittest discover -s tests
    requirements:
      run:
        - python ${{ python_min }}.*
    files:
      source:
        - tests/

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: View mseed headers
  description: |
    mseedpeek is a GUI application that can be used to view standard
    and verbose mseed header data, endianess, as well as blockette
    information.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://gitlab.com/earthscope/public/epic/passoft/mseedpeek

extra:
  recipe-maintainers:
    - omid-earthscope
    - destinykuehn-earthscope
